<svg width="1086" height="1448" viewBox="0 0 1086 1448" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="24" markerHeight="24" refX="18" refY="12" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L22 12L2 22" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Main route. Keep this path id if you animate the ship with offset-path or GSAP MotionPathPlugin. -->
  <path
    id="ship-route"
    d="M840 110
       C970 190 950 300 810 350
       C670 400 520 390 470 500
       C425 600 610 635 650 720
       C700 820 535 850 405 910
       C250 980 245 1095 400 1140
       C575 1190 560 1290 300 1370"
    stroke="#111111"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
   
  />

  <circle cx="840" cy="110" r="25" fill="#111111"/>

  <!-- Ship icon group. You can move this group along #ship-route. -->
  <g id="ship" transform="translate(520 650)" filter="url(#soft-shadow)">
    <g transform="translate(-120 -110)">
      <!-- hull -->
      <path d="M20 150H220L195 205H52L20 150Z" fill="#111111"/>
      <path d="M52 205H195L165 235H86L52 205Z" fill="#111111"/>
      <path d="M40 167H205" stroke="#F6F0E4" stroke-width="7" stroke-linecap="round"/>
      <path d="M79 185H177" stroke="#F6F0E4" stroke-width="6" stroke-linecap="round"/>
      <circle cx="92" cy="170" r="6" fill="#F6F0E4"/>
      <circle cx="120" cy="170" r="6" fill="#F6F0E4"/>
      <circle cx="148" cy="170" r="6" fill="#F6F0E4"/>
      <circle cx="176" cy="170" r="6" fill="#F6F0E4"/>

      <!-- masts -->
      <path d="M85 38V154" stroke="#111111" stroke-width="8" stroke-linecap="round"/>
      <path d="M155 58V155" stroke="#111111" stroke-width="7" stroke-linecap="round"/>

      <!-- flags -->
      <path d="M88 40C112 30 123 48 139 38V67C119 78 108 59 88 68V40Z" fill="#111111"/>
      <path d="M158 60C176 52 186 67 201 58V82C185 89 175 74 158 83V60Z" fill="#111111"/>

      <!-- sails -->
      <path d="M80 58C45 82 45 122 80 145V58Z" fill="#111111"/>
      <path d="M94 58C132 82 132 124 94 145V58Z" fill="#111111"/>
      <path d="M148 78C120 97 120 130 148 148V78Z" fill="#111111"/>
      <path d="M160 78C188 97 188 130 160 148V78Z" fill="#111111"/>

      <!-- mast ropes -->
      <path d="M85 55L35 150" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
      <path d="M155 75L205 150" stroke="#111111" stroke-width="4" stroke-linecap="round"/>

      <!-- waves -->
      <path d="M18 242C35 228 50 228 68 242C87 256 103 256 122 242C141 228 157 228 175 242C194 256 211 256 228 242" stroke="#111111" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M38 264C54 252 70 252 86 264C103 276 119 276 136 264C153 252 170 252 186 264" stroke="#111111" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
