<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./color.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Gemstones&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>
    <main>
      <div class="content">
        <a href="../index.html">Back</a>
        <section class="da">
          <h2>Learn colors</h2>
          <div class="words">
            <div class="word" data-color="red">red</div>
            <div class="word" data-color="blue">blue</div>
            <div class="word" data-color="green">green</div>
            <div class="word" data-color="yellow">yellow</div>
            <div class="word" data-color="orange">orange</div>
            <div class="word" data-color="purple">purple</div>
            <div class="word" data-color="pink">pink</div>
            <div class="word" data-color="brown">brown</div>
            <div class="word" data-color="black">black</div>
            <div class="word" data-color="gray">gray</div>
          </div>
          <div class="circles">
            <div class="circle" data-color="red" style="background: red"></div>
            <div
              class="circle"
              data-color="blue"
              style="background: blue"
            ></div>
            <div
              class="circle"
              data-color="pink"
              style="background: pink"
            ></div>
            <div
              class="circle"
              data-color="yellow"
              style="background: yellow"
            ></div>
            <div
              class="circle"
              data-color="orange"
              style="background: orange"
            ></div>
            <div
              class="circle"
              data-color="purple"
              style="background: purple"
            ></div>

            <div
              class="circle"
              data-color="brown"
              style="background: brown"
            ></div>
            <div
              class="circle"
              data-color="black"
              style="background: black"
            ></div>
            <div
              class="circle"
              data-color="gray"
              style="background: gray"
            ></div>
            <div
              class="circle"
              data-color="green"
              style="background: green"
            ></div>
          </div>
        </section>
      </div>
    </main>
    <footer></footer>
    <script src="color.js"></script>
  </body>
</html>
